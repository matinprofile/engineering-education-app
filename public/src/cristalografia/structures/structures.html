<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase Diagrams</title>
  <style>
    body {
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    #mainCanvas {
      display: grid;
      grid-template-areas:
        "buttons threed1 threed2 plane"
        "options options options backButton";
    }

    #threedCanvas1 {
      grid-area: threed1;
      justify-self: end;
    }

    #threedCanvas2 {
      grid-area: threed2;
      justify-self: end;
    }

    #buttonCanvas {
      grid-area: buttons;
      justify-self: center;
    }

    #planeCanvas {
      grid-area: plane;
    }

    #optionsCanvas {
      grid-area: options;
    }

    #backButtonCanvas {
      grid-area: backButton;
    }

    #POFImageCanvas {
      justify-self: center;
      grid-area: 1 / 2 / 2 / 5;
    }

    #IDistImageCanvas {
      justify-self: center;
      grid-area: 1 / 3 / 3 / 5;
    }

    #initialInfoCanvas {
      justify-self: end;
      grid-area: 1 / 1 / 3 / 3;
      align-self: center;
    }

    #initial3DCanvas {
      justify-self: center;
      grid-area: 1 / 3 / 2 / 5;
    }

    #initialInfoFormulasCanvas {
      justify-self: center;
      grid-area: 2 / 3 / 3 / 5;
    }
  </style>

  <div id="mainCanvas">
    <div id="threedCanvas1">
    </div>
    <div id="threedCanvas2">
    </div>
    <div id="buttonCanvas">
    </div>
    <div id="planeCanvas">
    </div>
    <div id="optionsCanvas">
    </div>
    <div id="backButtonCanvas">
    </div>
    <div id="POFImageCanvas">
    </div>
    <div id="IDistImageCanvas">
    </div>
    <div id="initialInfoCanvas">
    </div>
    <div id="initial3DCanvas">
    </div>
    <div id="initialInfoFormulasCanvas">
    </div>
  </div>


  <!-- Bibliotecas importadas -->
  <script src="../../../modules/p5/p5.js"></script>

  <!-- Código -->
  <script src="../utils.js"></script>
  <script src="sketch.js"></script>
  <script src="../interface.js"></script>

  <link rel="stylesheet" type="text.css" href="../../css/style.css">
  <meta charset="utf-8" />
</head>

<body>
</body>

</html>
